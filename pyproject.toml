[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ----------------------------------------------------------------------------
# Project metadata
# Most fields are static; "version" is read dynamically from pefile.py so
# that the single source of truth remains __version__ in that module.
# ----------------------------------------------------------------------------
[project]
name = "pefile"
dynamic = ["version"]
description = "Python PE parsing module"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6.0"
authors = [
    { name = "Ero Carrera", email = "ero.carrera@gmail.com" },
]
keywords = ["pe", "exe", "dll", "pefile", "pecoff"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "coverage",
    "tox",
    "tox-gh-actions",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/erocarrera/pefile"
Source = "https://github.com/erocarrera/pefile"
"Bug Tracker" = "https://github.com/erocarrera/pefile/issues"
Download = "https://github.com/erocarrera/pefile/releases"

# ----------------------------------------------------------------------------
# Hatchling configuration
# ----------------------------------------------------------------------------

# Read __version__ from pefile.py using a regex (no import required).
[tool.hatch.version]
path = "pefile.py"

# Wheel: explicitly list the two top-level single-file modules and the
# ordlookup package.  Hatchling does not auto-detect root-level .py files
# the same way setuptools does, so we enumerate them explicitly.
[tool.hatch.build.targets.wheel]
include = [
    "/pefile.py",
    "/peutils.py",
    "/ordlookup",
]

# Sdist: include source files, documentation, and the build config.
[tool.hatch.build.targets.sdist]
include = [
    "/pefile.py",
    "/peutils.py",
    "/ordlookup",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

# ----------------------------------------------------------------------------
# Tox configuration (previously in tox.ini)
# ----------------------------------------------------------------------------
[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py38,py39,py310,py311,py312,coverage

[testenv]
deps =
    pytest
    coverage
commands =
    python -m coverage run -p -m pytest --ignore=./tests/pefile_test.py

[testenv:coverage]
basepython = python3.10
commands =
    python -m coverage combine
    python -m coverage report -m --skip-covered --ignore-errors
    python -m coverage json --ignore-errors

[gh-actions]
python =
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312
"""

# ============================================================================
# How to derive the version from version control (e.g. git tags)
# ============================================================================
#
# The current setup keeps __version__ as a plain string in pefile.py and reads
# it at build time via [tool.hatch.version] above (regex match, no import).
# If you want the version to be driven entirely by git tags instead, follow
# the steps below.  The same technique can be extended to __author__ and
# __contact__ by adding a build hook (see step 4).
#
# Step 1 – Switch the build requirements to hatch-vcs:
#
#   [build-system]
#   requires = ["hatchling", "hatch-vcs"]
#   build-backend = "hatchling.build"
#
# Step 2 – Switch the version source in [tool.hatch.version]:
#
#   [tool.hatch.version]
#   source = "vcs"
#
#   [tool.hatch.version.raw-options]
#   # Write the VCS-derived version into a file so the installed package can
#   # report its own version without hatchling being present at runtime.
#   version_scheme = "no-guess-dev"
#
# Step 3 – In pefile.py, replace the hard-coded assignment with:
#
#   try:
#       from importlib.metadata import version, PackageNotFoundError
#       __version__ = version("pefile")
#   except PackageNotFoundError:     # running from an uninstalled source tree
#       __version__ = "0.0.0.dev0"
#
#   And in peutils.py the existing  __version__ = pefile.__version__  line
#   already picks up whatever pefile exports, so no change is needed there.
#
# Step 4 – (Optional) Stamp __version__ back into pefile.py/peutils.py at
#   build time with a hatchling build hook.  Create hatch_build.py next to
#   pyproject.toml:
#
#   # hatch_build.py
#   import re
#   from hatchling.builders.hooks.plugin.interface import BuildHookInterface
#
#   class CustomBuildHook(BuildHookInterface):
#       def initialize(self, version, build_data):
#           pattern = r'^(__version__\s*=\s*)["\'].*["\']'
#           replacement = r'\g<1>"{}"'.format(version)
#           for path in ("pefile.py", "peutils.py"):
#               with open(path, "r", encoding="utf-8") as fh:
#                   content = fh.read()
#               updated = re.sub(pattern, replacement, content,
#                                flags=re.MULTILINE)
#               with open(path, "w", encoding="utf-8") as fh:
#                   fh.write(updated)
#
#   Then register the hook in pyproject.toml:
#
#   [tool.hatch.build.hooks.custom]
#   path = "hatch_build.py"
#
# Step 5 – (Optional) Stamp __author__ and __contact__ the same way by
#   extending the hook's initialize() method with similar re.sub calls for
#   those attributes, reading the desired values from wherever you maintain
#   them (e.g. CITATION.cff, a separate AUTHORS file, or pyproject.toml
#   itself).
#
# Step 6 – Tag releases with  git tag v2024.8.26  and push the tag.
#   hatch-vcs will then report "2024.8.26" as the version automatically.
#   For a dev build on a commit after the tag it reports "2024.8.26.dev1+…"
#   or similar, making every build uniquely identifiable from VCS history alone.
# ============================================================================
